name: CI

on:
  pull_request:
  push:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC (OWASP dependency check)

jobs:
  verify:
    name: Web And Backend Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci

      - name: npm audit (production dependencies)
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true  # Don't block on advisories yet; review findings

      - name: Run pipeline verify
        # pipeline.sh verify runs generate:sync-contract and git diff --exit-code,
        # which covers all three generated tiers (TS, Java, Swift).
        run: ./scripts/pipeline.sh verify

      - name: Verify generated files are up to date
        run: |
          npm run generate:sync-contract
          git diff --exit-code src/generated/ backend/src/main/java/com/meditation/backend/sync/GeneratedSyncContract.java ios-native/Sources/MeditationNativeCore/Domain/GeneratedSyncContract.swift

      - name: OWASP dependency check (backend)
        if: github.event_name == 'schedule'
        run: |
          cd backend
          ./mvnw org.owasp:dependency-check-maven:check

      - name: Check repo hygiene
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            ./scripts/check-repo-hygiene.sh --diff-range "origin/${GITHUB_BASE_REF}...HEAD"
          elif [[ -n "${GITHUB_EVENT_BEFORE:-}" && "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]]; then
            ./scripts/check-repo-hygiene.sh --diff-range "${GITHUB_EVENT_BEFORE}...HEAD"
          else
            ./scripts/check-repo-hygiene.sh --diff-range "HEAD"
          fi
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

  ios-native:
    name: iOS Native Verify
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Swift package tests
        run: swift test --package-path ios-native

      - name: Build and test iOS app target
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios-native/MeditationNative.xcodeproj \
            -scheme MeditationNative \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.4' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

  ios-ui-tests:
    name: iOS UI Tests
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run iOS UI Tests
        run: |
          xcodebuild test \
            -project ios-native/MeditationNative.xcodeproj \
            -scheme MeditationNativeUITests \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true
